<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — Tomato Store{% else %}Tomato Store — Fully Automated Plant Cultivation &amp; Harvesting System{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <!-- Single bilingual font (Latin + Hangul) so EN ⇄ KO toggling never swaps
         the family or fakes a bold weight — see the wobble fix in style.css. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <!-- Restore the saved language before paint so the correct font is used immediately. -->
    <script>
        (function () {
            try {
                var l = localStorage.getItem('tomato-store-lang');
                if (l === 'ko' || l === 'en') { document.documentElement.setAttribute('lang', l); }
            } catch (e) {}
        })();
    </script>
</head>
<body>

    {% include navbar.html %}

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
</html>
