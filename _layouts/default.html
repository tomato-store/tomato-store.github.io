<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — Tomato Store{% else %}Tomato Store — Fully Automated Plant Cultivation &amp; Harvesting System{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <!-- Restore the saved language before paint so the correct font is used immediately. -->
    <script>
        (function () {
            try {
                var l = localStorage.getItem('tomato-store-lang');
                if (l === 'ko' || l === 'en') { document.documentElement.setAttribute('lang', l); }
            } catch (e) {}
        })();
    </script>
</head>
<body>

    {% include navbar.html %}

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
</html>
